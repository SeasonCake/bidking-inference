name: Feature request
description: Propose a domain-neutral improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the reusable public problem, not a private product request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed public contract
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic example or evidence
    validations:
      required: true
