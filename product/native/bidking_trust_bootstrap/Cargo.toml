[package]
name = "bidking_trust_bootstrap"
version = "0.1.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[[bin]]
name = "bidking_trust_bootstrap"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2.2.0"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.48.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
