[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-inference"
version = "0.1.0"
description = "Domain-neutral discrete inference and synthetic Monte Carlo examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
auction-inference = "auction_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
