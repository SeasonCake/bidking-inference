[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-inference"
version = "0.1.0"
description = "Domain-neutral discrete inference with composable evidence and simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SeasonCake" }]
keywords = ["inference", "bayesian", "probability", "constraints", "monte-carlo"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SeasonCake/bidking-inference"
Source = "https://github.com/SeasonCake/bidking-inference"
"Companion Skills" = "https://github.com/SeasonCake/evidence-first-agent-skills"

[project.scripts]
auction-inference = "auction_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# Exact type checks intentionally reject booleans and container subclasses at trust boundaries.
ignore = ["E721"]
